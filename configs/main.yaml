# Full v0.1: 300 base examples per task, every axis, every model.
name: main
seed: 20261119

data:
  path: data/ssb_v0.1.jsonl
  version: "0.1"
  raw_dir: data/raw
  tokenizer: bert-base-uncased        # every token count uses this WordPiece tokenizer
  paragraph_tokens: 120
  tolerance: 0.10                     # filler, paraphrases and swapped copies: 108-132 tokens
  examples: {classification: 300, retrieval: 300, qa: 300}
  qa_unanswerable_share: 0.5
  random_pool: 3000
  hard_pool: 4000
  selector_model: sentence-transformers/all-mpnet-base-v2   # not an evaluated model
  ner_model: en_core_web_sm
  paraphrase_models: [Helsinki-NLP/opus-mt-en-fr, Helsinki-NLP/opus-mt-fr-en]
  label_judge: fabriceyhc/bert-base-uncased-ag_news          # not an evaluated model
  device: auto

conditions:
  sizes: [1, 5, 20, 100]
  axes: [dilution, noise, redundancy, contradiction, position]
  base_filler: random
  redundancy_k: 5
  redundancy_modes: [copy, paraphrase]
  contradiction_positions: [before, after]
  depths: [0.0, 0.5, 1.0]

models:
  - {name: tfidf-lr, task: classification, kind: tfidf_lr}
  - {name: bert-truncate, task: classification, kind: transformer_cls,
     model_id: textattack/bert-base-uncased-ag-news, long_input: truncate}
  - {name: bert-chunk-mean, task: classification, kind: transformer_cls,
     model_id: textattack/bert-base-uncased-ag-news, long_input: chunk_mean}
  - {name: tfidf, task: retrieval, kind: tfidf}
  - {name: bm25, task: retrieval, kind: bm25}
  - {name: minilm, task: retrieval, kind: dense, model_id: sentence-transformers/all-MiniLM-L6-v2}
  - {name: distilbert-squad, task: qa, kind: qa, model_id: distilbert-base-cased-distilled-squad,
     handles_unanswerable: false}
  - {name: roberta-squad2, task: qa, kind: qa, model_id: deepset/roberta-base-squad2}

run:
  output_dir: results/main
  device: auto
  max_seq_len: 384
  doc_stride: 128
  examples: null

eval:
  bootstrap: 1000
  ci: 0.95
  saturation_epsilon: 0.01
  alpha: 0.05
  ece_bins: 10

figures_dir: figures
