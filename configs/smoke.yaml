# End-to-end check on a T4 in under 15 minutes: same dataset as main, 10 questions,
# smallest model only.
name: smoke
seed: 20261118

dataset:
  path: data/ssb_v0.1.jsonl
  version: "0.1"
  questions: {single_hop: 34, multi_hop: 33, unanswerable: 33}
  paragraph_tokens: 120
  tolerance: 0.10
  tokenizer: Qwen/Qwen2.5-1.5B-Instruct
  hard_negative_scorer: embedding
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  offtopic_pool: 400
  world: {people: 80, towns: 40, companies: 40, inventions: 40}

conditions:
  sizes: [1, 5, 20, 100]
  axes: [dilution, noise, redundancy, contradiction, position]
  base_filler: random
  redundancy_k: [1, 5]
  contradiction_positions: [before, after]
  depths: [0.0, 0.5, 1.0]
  closed_book: true

models:
  - name: qwen2.5-1.5b
    model_id: Qwen/Qwen2.5-1.5B-Instruct

generation:
  max_new_tokens: 32
  temperature: 0.0

run:
  output_dir: results/smoke
  cache_dir: .cache/generations
  questions: 10                    # balanced subset across task types
  max_gpu_hours: 0.25

eval:
  bootstrap: 1000
  ci: 0.95
  saturation_epsilon: 0.01
  alpha: 0.05
  ece_bins: 10

figures_dir: figures/smoke
