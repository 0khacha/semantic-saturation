[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssb"
version = "0.1.0"
description = "Semantic Saturation Benchmark: does more context help a language model, and when does it start to hurt?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mohamed Khacha" }]
dependencies = [
    "pyyaml==6.0.3",
    "tokenizers==0.23.3",
]

[project.optional-dependencies]
# Only needed to rebuild the dataset (hard-negative ranking); the published file is in data/.
build = [
    "sentence-transformers==6.3.0",
]
# Model runs. torch is deliberately not pinned: use the CUDA build your platform ships
# (Kaggle/Colab preinstall one); the exact versions used are saved in run_manifest.json.
run = [
    "transformers==5.23.0",
    "accelerate==1.16.0",
    "bitsandbytes==0.50.2",
]
# Optional faster backend; `backend: auto` uses it when installed and a GPU is present.
vllm = [
    "vllm==0.34.0",
]
analysis = [
    "numpy==2.4.6",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "matplotlib==3.11.2",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.16.6",
]

[project.scripts]
ssb = "ssb.cli:main"

[tool.setuptools.packages.find]
include = ["ssb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
