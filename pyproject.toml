[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssb"
version = "0.1.0"
description = "Semantic Saturation Benchmark: does more context help a language model, and when does it start to hurt?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Mohamed Khacha" }]
dependencies = [
    "pyyaml==6.0.3",
    "tokenizers==0.23.3",
]

[project.optional-dependencies]
# Only needed to rebuild the dataset (hard-negative ranking); the published file is in data/.
build = [
    "sentence-transformers==6.3.0",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.16.6",
]

[project.scripts]
ssb = "ssb.cli:main"

[tool.setuptools.packages.find]
include = ["ssb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
